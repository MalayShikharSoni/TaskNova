# ============================================================
#  TaskNova — Application Properties (Development / Default)
# ============================================================

spring.application.name=TaskNova
server.port=8080

# ===== H2 Persistent File Database =====
spring.datasource.url=jdbc:h2:file:./data/tasknova;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== H2 Console (dev only — disable in prod) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# JWT secret must match the prefix used in JwtConfig.java (@Value("${jwt.secret}"))
jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7e7d0d9b2a69ec87f8db41e39c747d8a1234567890abcdef
jwt.expiration-ms=86400000

# ===== Spring Security =====
spring.security.filter.order=10

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true

info.app.name=TaskNova
info.app.version=1.0.0
info.app.description=Task Management System

# ===== Logging =====
logging.level.com.tasknova=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# ===== Multipart =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== Async (used by AuditService @Async) =====
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
