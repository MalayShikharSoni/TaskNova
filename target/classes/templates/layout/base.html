<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" th:content="${pageDescription ?: 'TaskNova — Manage your tasks efficiently'}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | TaskNova' : 'TaskNova'}">TaskNova</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}"/>

    <!-- Page-specific CSS slot -->
    <th:block th:replace="${extraCss} ?: ~{}"/>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     SIDEBAR + MAIN LAYOUT WRAPPER
     ═══════════════════════════════════════════════ -->
<div class="app-shell">

    <!-- Sidebar: swap between user-nav and admin-nav based on role -->
    <aside class="sidebar" id="sidebar">
        <sec:authorize access="hasRole('ADMIN')">
            <div th:replace="~{layout/admin-nav :: adminNav}"></div>
        </sec:authorize>
        <sec:authorize access="hasRole('USER') and !hasRole('ADMIN')">
            <div th:replace="~{layout/user-nav :: userNav}"></div>
        </sec:authorize>
    </aside>

    <!-- Main content area -->
    <main class="main-content">

        <!-- Top bar -->
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <span></span><span></span><span></span>
            </button>
            <div class="topbar-right">
                <div class="user-pill">
                    <div class="user-avatar" sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</div>
                    <span class="user-name" sec:authentication="name">User</span>
                    <sec:authorize access="hasRole('ADMIN')">
                        <span class="role-badge role-badge--admin">Admin</span>
                    </sec:authorize>
                    <sec:authorize access="hasRole('USER') and !hasRole('ADMIN')">
                        <span class="role-badge role-badge--user">User</span>
                    </sec:authorize>
                </div>
                <form th:action="@{/auth/logout}" method="post" style="margin:0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-logout" title="Sign out">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </form>
            </div>
        </header>

        <!-- Page content slot -->
        <div class="page-content">
            <th:block th:replace="${content}"/>
        </div>

    </main>
</div>

<!-- Toast notification container -->
<div id="toast-container" class="toast-container"></div>

<!-- Main JS -->
<script th:src="@{/js/main.js}"></script>

<!-- Page-specific JS slot -->
<th:block th:replace="${extraJs} ?: ~{}"/>

</body>
</html>
