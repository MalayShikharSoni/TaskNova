<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head(pageTitle='User Management')}"></head>
<body>
<div th:replace="~{layout/base :: body(content=~{::mainContent})}">
<th:block th:fragment="mainContent">

<div class="page-header">
    <div>
        <h1 class="page-title">User Management</h1>
        <p class="page-subtitle">View, activate, deactivate and change user roles</p>
    </div>
</div>

<!-- Search bar -->
<form th:action="@{/admin/users}" method="get" class="search-bar">
    <div class="search-input-wrapper">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" name="search" class="form-input search-input"
               th:value="${search}" placeholder="Search by name or email..."/>
    </div>
    <button type="submit" class="btn btn--primary">Search</button>
    <a th:if="${search != null}" th:href="@{/admin/users}" class="btn btn--ghost">Clear</a>
</form>

<!-- User table -->
<div class="card" th:if="${users.hasContent()}">
    <div class="table-wrapper">
        <table class="data-table" id="userTable">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Joined</th>
                    <th>Total Tasks</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users.content}" th:id="'user-row-' + ${u.id}">
                    <td>
                        <div class="user-cell">
                            <div class="user-avatar-sm" th:text="${#strings.substring(u.username, 0, 1).toUpperCase()}">U</div>
                            <span th:text="${u.username}">username</span>
                        </div>
                    </td>
                    <td th:text="${u.email}">email</td>
                    <td>
                        <span class="role-badge"
                              th:classappend="${u.role.name() == 'ADMIN'} ? 'role-badge--admin' : 'role-badge--user'"
                              th:text="${u.role}">USER</span>
                    </td>
                    <td>
                        <span class="status-indicator"
                              th:classappend="${u.active} ? 'status-indicator--active' : 'status-indicator--inactive'"
                              th:text="${u.active ? 'Active' : 'Inactive'}">Active</span>
                    </td>
                    <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'MMM d, yyyy') : '—'}">—</td>
                    <td th:text="${u.totalTasks}">0</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn--ghost btn--sm"
                                    th:data-user-id="${u.id}"
                                    th:data-active="${u.active}"
                                    onclick="toggleUserActive(this)"
                                    th:text="${u.active ? 'Deactivate' : 'Activate'}">Toggle</button>
                            <button class="btn btn--ghost btn--sm"
                                    th:data-user-id="${u.id}"
                                    th:data-role="${u.role}"
                                    onclick="changeUserRole(this)"
                                    th:text="${u.role.name() == 'ADMIN' ? 'Make User' : 'Make Admin'}">Role</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="empty-state" th:if="${!users.hasContent()}">
    <p class="empty-title">No users found</p>
    <p class="empty-subtitle" th:text="${search != null ? 'No results for: ' + search : 'No users in the system yet'}"></p>
</div>

<!-- Pagination -->
<div class="pagination" th:if="${users.totalPages > 1}">
    <a th:href="@{/admin/users(page=${currentPage - 1}, search=${search})}"
       class="page-btn" th:classappend="${currentPage == 0} ? 'page-btn--disabled' : ''">← Prev</a>
    <span class="page-info" th:text="'Page ' + ${currentPage + 1} + ' of ' + ${users.totalPages}">Page 1</span>
    <a th:href="@{/admin/users(page=${currentPage + 1}, search=${search})}"
       class="page-btn" th:classappend="${currentPage + 1 == users.totalPages} ? 'page-btn--disabled' : ''">Next →</a>
</div>

</th:block>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
