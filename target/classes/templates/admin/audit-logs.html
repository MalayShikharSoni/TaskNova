<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head(pageTitle='Audit Logs')}"></head>
<body>
<div th:replace="~{layout/base :: body(content=~{::mainContent})}">
<th:block th:fragment="mainContent">

<div class="page-header">
    <div>
        <h1 class="page-title">Audit Logs</h1>
        <p class="page-subtitle">Complete trail of all system actions</p>
    </div>
</div>

<!-- Filter by actor -->
<form th:action="@{/admin/audit-logs}" method="get" class="search-bar">
    <div class="search-input-wrapper">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" name="actor" class="form-input search-input"
               th:value="${actor}" placeholder="Filter by username or email..."/>
    </div>
    <button type="submit" class="btn btn--primary">Filter</button>
    <a th:if="${actor != null}" th:href="@{/admin/audit-logs}" class="btn btn--ghost">Clear</a>
</form>

<div class="card" th:if="${logs.hasContent()}">
    <div class="table-wrapper">
        <table class="data-table audit-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Actor</th>
                    <th>Action</th>
                    <th>Target</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${logs.content}">
                    <td class="audit-time"
                        th:text="${#temporals.format(log.timestamp, 'MMM d, HH:mm:ss')}">—</td>
                    <td>
                        <span class="user-chip" th:text="${log.actorUsername}">actor</span>
                    </td>
                    <td>
                        <span class="action-badge"
                              th:classappend="${log.action.contains('DELETE') or log.action.contains('DEACTIVATE')} ? 'action-badge--danger' :
                                              (${log.action.contains('CREATE') or log.action.contains('REGISTER')} ? 'action-badge--success' :
                                              'action-badge--info')"
                              th:text="${log.action}">ACTION</span>
                    </td>
                    <td>
                        <span th:if="${log.targetType != null}"
                              th:text="${log.targetType + (log.targetId != null ? ' #' + log.targetId : '')}">—</span>
                        <span th:if="${log.targetType == null}" class="text--muted">—</span>
                    </td>
                    <td class="audit-details" th:text="${log.details ?: '—'}">—</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="empty-state" th:if="${!logs.hasContent()}">
    <p class="empty-title">No audit logs</p>
    <p class="empty-subtitle">System activity will appear here as users interact with TaskNova.</p>
</div>

<!-- Pagination -->
<div class="pagination" th:if="${logs.totalPages > 1}">
    <a th:href="@{/admin/audit-logs(page=${currentPage - 1}, actor=${actor})}"
       class="page-btn" th:classappend="${currentPage == 0} ? 'page-btn--disabled' : ''">← Prev</a>
    <span class="page-info" th:text="'Page ' + ${currentPage + 1} + ' of ' + ${logs.totalPages}">Page 1</span>
    <a th:href="@{/admin/audit-logs(page=${currentPage + 1}, actor=${actor})}"
       class="page-btn" th:classappend="${currentPage + 1 == logs.totalPages} ? 'page-btn--disabled' : ''">Next →</a>
</div>

</th:block>
</div>
</body>
</html>
