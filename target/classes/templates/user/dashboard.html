<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head(pageTitle='Dashboard')}"></head>
<body>
<div th:replace="~{layout/base :: body(content=~{::mainContent})}">
<th:block th:fragment="mainContent">

<div class="page-header">
    <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Welcome back, <strong th:text="${user.username}">User</strong> 👋</p>
    </div>
    <button class="btn btn--primary" id="openCreateTaskModal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Task
    </button>
</div>

<!-- ── Stat Cards ── -->
<div class="stats-grid">
    <div class="stat-card stat-card--total">
        <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
                <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" th:text="${totalTasks}">0</span>
            <span class="stat-label">Total Tasks</span>
        </div>
    </div>
    <div class="stat-card stat-card--todo">
        <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" th:text="${todoCount}">0</span>
            <span class="stat-label">To Do</span>
        </div>
    </div>
    <div class="stat-card stat-card--inprogress">
        <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" th:text="${inProgCount}">0</span>
            <span class="stat-label">In Progress</span>
        </div>
    </div>
    <div class="stat-card stat-card--done">
        <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" th:text="${doneCount}">0</span>
            <span class="stat-label">Done</span>
        </div>
    </div>
    <div class="stat-card stat-card--overdue" th:classappend="${overdueCount > 0} ? 'stat-card--alert' : ''">
        <div class="stat-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>
        <div class="stat-info">
            <span class="stat-value" th:text="${overdueCount}">0</span>
            <span class="stat-label">Overdue</span>
        </div>
    </div>
</div>

<!-- ── Recent Tasks ── -->
<div class="section-header">
    <h2 class="section-title">Recent Tasks</h2>
    <a th:href="@{/tasks}" class="section-link">View all →</a>
</div>

<div class="task-list" th:if="${not #lists.isEmpty(recentTasks)}">
    <div th:each="task : ${recentTasks}" class="task-card"
         th:classappend="${task.overdue} ? 'task-card--overdue' : ''">
        <div class="task-card-left">
            <span class="priority-dot"
                  th:classappend="'priority-dot--' + ${#strings.toLowerCase(task.priority)}"></span>
            <div>
                <p class="task-card-title" th:text="${task.title}">Task title</p>
                <p class="task-card-meta">
                    <span th:if="${task.dueDate != null}"
                          th:text="'Due ' + ${#temporals.format(task.dueDate, 'MMM d')}">Due date</span>
                    <span th:if="${task.overdue}" class="badge badge--overdue">Overdue</span>
                </p>
            </div>
        </div>
        <div class="task-card-right">
            <span class="status-badge"
                  th:classappend="'status-badge--' + ${#strings.toLowerCase(#strings.replace(task.status.name(), '_', '-'))}"
                  th:text="${task.statusLabel}">Status</span>
            <a th:href="@{/tasks/{id}(id=${task.id})}" class="btn btn--ghost btn--sm">View</a>
        </div>
    </div>
</div>

<div class="empty-state" th:if="${#lists.isEmpty(recentTasks)}">
    <div class="empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
    </div>
    <p class="empty-title">No tasks yet</p>
    <p class="empty-subtitle">Create your first task to get started</p>
    <button class="btn btn--primary" id="openCreateTaskModal2">Create a task</button>
</div>

<!-- ════════════════════════════════
     Create Task Modal
     ════════════════════════════════ -->
<div class="modal-overlay" id="createTaskModal" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Create New Task</h3>
            <button class="modal-close" id="closeCreateTaskModal" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label" for="taskTitle">Title <span class="required">*</span></label>
                <input type="text" id="taskTitle" class="form-input" placeholder="What needs to be done?" maxlength="200"/>
                <span class="form-error" id="taskTitleError"></span>
            </div>
            <div class="form-group">
                <label class="form-label" for="taskDescription">Description</label>
                <textarea id="taskDescription" class="form-input form-textarea" rows="3" placeholder="Add details..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="taskDueDate">Due Date</label>
                    <input type="date" id="taskDueDate" class="form-input"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="taskPriority">Priority</label>
                    <select id="taskPriority" class="form-input form-select">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Tags</label>
                <div class="tag-picker" id="tagPicker"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn--ghost" id="cancelCreateTask">Cancel</button>
            <button class="btn btn--primary" id="submitCreateTask">
                <span id="createTaskBtnText">Create Task</span>
                <span id="createTaskSpinner" class="btn-spinner" style="display:none"></span>
            </button>
        </div>
    </div>
</div>

</th:block>
</div>
<script th:src="@{/js/tasks.js}"></script>
</body>
</html>
