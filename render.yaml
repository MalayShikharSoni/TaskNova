services:
  - type: web
    name: tasknova
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    # Free tier has no persistent disk, so H2 runs in memory and data resets on
    # every restart/deploy. Upgrade the plan, mount a disk, and point H2_DB_PATH at
    # it (dropping the two datasource/ddl overrides below) for persistent data.
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:tasknova;DB_CLOSE_DELAY=-1;MODE=MySQL
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: create-drop
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: LOGGING_LEVEL_COM_TASKNOVA
        value: INFO
      # This blueprint deploys a public demo, so the seeded demo credentials are
      # shown on the login page. For a private deployment, uncomment these:
      # - key: ADMIN_PASSWORD
      #   sync: false          # set it in the Render dashboard
      # - key: SHOW_DEMO_HINT
      #   value: "false"
