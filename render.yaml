services:
  - type: web
    name: tasknova
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # ── Health Check ──────────────────────────────────────────
    healthCheckPath: /actuator/health
    # ── Environment Variables ──────────────────────────────────
    # NOTE: Free tier has no persistent disk, so H2 runs in-memory.
    # Data resets on each restart. Upgrade plan to add disk + file-based H2.
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:tasknova;DB_CLOSE_DELAY=-1;MODE=MySQL
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: create-drop
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "false"
      - key: LOGGING_LEVEL_COM_TASKNOVA
        value: INFO
