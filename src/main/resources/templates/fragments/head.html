<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="TaskNova: a calm, riso-printed workspace for your tasks."/>
    <meta name="theme-color" content="#f3f2ee"/>
    <title th:text="${title != null ? title + ' · TaskNova' : 'TaskNova'}">TaskNova</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('tn-theme');
                if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"/>
    <link rel="stylesheet" href="/css/main.css"/>
</head>
<body></body>
</html>
