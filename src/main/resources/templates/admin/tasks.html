<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(title='Every task', content=~{::content}, scripts=~{})}">
<body>
<th:block th:fragment="content" th:with="sp=${search != '' ? search : null}">

    <header class="page-head">
        <div>
            <p class="kicker"><span>Admin</span><span class="dot"></span>
                <span th:text="${tasks.totalElements + (tasks.totalElements == 1 ? ' task' : ' tasks')}">8 tasks</span></p>
            <h1>Every task, <em>everyone's</em></h1>
            <p class="lede">The whole pile across all accounts. Open one to edit it or assign it to someone.</p>
        </div>
    </header>

    <form class="toolbar" action="/admin/tasks" method="get" role="search">
        <div class="search">
            <svg class="i"><use href="/assets/icons.svg#i-search"/></svg>
            <input class="input" type="search" name="search" id="searchInput" th:value="${search}" placeholder="Search titles and notes…" aria-label="Search tasks"/>
        </div>
        <select class="input" name="status" aria-label="Status" onchange="this.form.submit()">
            <option value="">Any status</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${selectedStatus == s}"
                    th:text="${s.name() == 'TODO' ? 'To do' : (s.name() == 'IN_PROGRESS' ? 'In progress' : 'Done')}">To do</option>
        </select>
        <button class="btn btn--ink" type="submit">Search</button>
        <a th:if="${search != '' or selectedStatus != null}" class="btn btn--quiet btn--sm" href="/admin/tasks">Clear</a>
    </form>

    <section class="card" th:if="${tasks.hasContent()}">
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr><th>Task</th><th>Owner</th><th>Assignee</th><th>Priority</th><th>Status</th><th>Due</th></tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tasks.content}">
                    <td>
                        <a class="cell-title" th:href="@{/tasks/{id}(id=${t.id})}" th:text="${t.title}">Title</a>
                        <div class="cell-sub" th:text="${t.description ?: ''}"></div>
                        <span th:replace="~{fragments/ui :: tags(${t.tagDetails})}"></span>
                    </td>
                    <td>
                        <a class="cell-user" th:href="@{/admin/users/{id}(id=${t.ownerId})}">
                            <span class="avatar avatar--sm" th:attr="data-hue=${t.ownerId % 6}" th:text="${#strings.toUpperCase(#strings.substring(t.ownerUsername, 0, 1))}">O</span>
                            <span th:text="${t.ownerUsername}">owner</span>
                        </a>
                    </td>
                    <td>
                        <a class="cell-user" th:if="${t.assigneeId != null}" th:href="@{/admin/users/{id}(id=${t.assigneeId})}">
                            <span class="avatar avatar--sm" th:attr="data-hue=${t.assigneeId % 6}" th:text="${#strings.toUpperCase(#strings.substring(t.assigneeUsername, 0, 1))}">A</span>
                            <span th:text="${t.assigneeUsername}">assignee</span>
                        </a>
                        <span class="muted" th:if="${t.assigneeId == null}">—</span>
                    </td>
                    <td><span th:replace="~{fragments/ui :: prio(${t.priority})}"></span></td>
                    <td><span th:replace="~{fragments/ui :: status(${t})}"></span></td>
                    <td><span th:replace="~{fragments/ui :: due(${t})}"></span><span class="muted" th:if="${t.dueDate == null}">—</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card" th:unless="${tasks.hasContent()}">
        <div class="empty">
            <svg th:replace="~{fragments/ui :: artMagnifier}"></svg>
            <h3>Nothing found</h3>
            <p>No tasks match those filters.</p>
        </div>
    </section>

    <nav class="pager" th:if="${tasks.totalPages > 1}" aria-label="Pagination">
        <a class="btn btn--ghost btn--sm" th:href="@{/admin/tasks(page=${currentPage - 1}, search=${sp}, status=${selectedStatus})}" th:attr="aria-disabled=${tasks.first}">
            <svg class="i i-sm"><use href="/assets/icons.svg#i-arrow-left"/></svg> Newer</a>
        <span class="mono" th:text="${'Page ' + (currentPage + 1) + ' of ' + tasks.totalPages}">Page 1</span>
        <a class="btn btn--ghost btn--sm" th:href="@{/admin/tasks(page=${currentPage + 1}, search=${sp}, status=${selectedStatus})}" th:attr="aria-disabled=${tasks.last}">
            Older <svg class="i i-sm"><use href="/assets/icons.svg#i-arrow-right"/></svg></a>
    </nav>
</th:block>
</body>
</html>
