<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(title='People', content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">

    <header class="page-head">
        <div>
            <p class="kicker"><span>Admin</span><span class="dot"></span>
                <span th:text="${users.totalElements + (users.totalElements == 1 ? ' account' : ' accounts')}">2 accounts</span></p>
            <h1>The <em>people</em></h1>
            <p class="lede">Promote, demote, pause or restore accounts. You can't change your own role or lock yourself out.</p>
        </div>
    </header>

    <form class="toolbar" action="/admin/users" method="get" role="search">
        <div class="search">
            <svg class="i"><use href="/assets/icons.svg#i-search"/></svg>
            <input class="input" type="search" name="search" id="searchInput" th:value="${search}" placeholder="Search by name or email…" aria-label="Search people"/>
        </div>
        <button class="btn btn--ink" type="submit">Search</button>
        <a th:if="${search != ''}" class="btn btn--quiet btn--sm" href="/admin/users">Clear</a>
    </form>

    <section class="card" th:if="${users.hasContent()}">
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>Person</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Joined</th>
                    <th class="num">Tasks</th>
                    <th style="text-align:right">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users.content}" th:id="'user-' + ${u.id}"
                    th:with="self=${currentUser != null and currentUser.id == u.id}">
                    <td>
                        <a class="cell-user" th:href="@{/admin/users/{id}(id=${u.id})}">
                            <span class="avatar" th:attr="data-hue=${u.id % 6}" th:text="${#strings.toUpperCase(#strings.substring(u.username, 0, 1))}">U</span>
                            <span>
                                <strong><span class="cell-title" th:text="${u.username}">user</span><span class="you-badge" th:if="${self}">you</span></strong>
                                <small th:text="${u.email}">user@example.com</small>
                            </span>
                        </a>
                    </td>
                    <td><span class="pill" data-role-pill th:classappend="${u.role.name() == 'ADMIN'} ? 'pill--admin' : 'pill--user'"
                              th:text="${u.role.name() == 'ADMIN' ? 'Admin' : 'Member'}">Member</span></td>
                    <td><span class="pill" data-active-pill th:classappend="${u.active} ? 'pill--active' : 'pill--inactive'"
                              th:text="${u.active ? 'Active' : 'Paused'}">Active</span></td>
                    <td class="mono muted" th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'd MMM yyyy') : '—'}">—</td>
                    <td class="num" th:text="${u.totalTasks}">0</td>
                    <td>
                        <div class="actions" th:unless="${self}">
                            <button class="btn btn--ghost btn--sm" type="button" data-action="role"
                                    th:attr="data-user-id=${u.id},data-role=${u.role},data-name=${u.username}"
                                    th:text="${u.role.name() == 'ADMIN' ? 'Make member' : 'Make admin'}">Make admin</button>
                            <button class="btn btn--ghost btn--sm" type="button" data-action="toggle"
                                    th:attr="data-user-id=${u.id},data-active=${u.active},data-name=${u.username}"
                                    th:hidden="${u.role.name() == 'ADMIN'}"
                                    th:text="${u.active ? 'Pause' : 'Restore'}">Pause</button>
                        </div>
                        <div class="actions" th:if="${self}"><span class="muted mono" style="font-size:.75rem">That's you</span></div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card" th:unless="${users.hasContent()}">
        <div class="empty">
            <svg th:replace="~{fragments/ui :: artMagnifier}"></svg>
            <h3>No one by that name</h3>
            <p th:text="${'Nothing matched “' + search + '”.'}">Nothing matched.</p>
        </div>
    </section>

    <nav class="pager" th:if="${users.totalPages > 1}" aria-label="Pagination">
        <a class="btn btn--ghost btn--sm" th:href="@{/admin/users(page=${currentPage - 1}, search=${search})}" th:attr="aria-disabled=${users.first}">
            <svg class="i i-sm"><use href="/assets/icons.svg#i-arrow-left"/></svg> Previous</a>
        <span class="mono" th:text="${'Page ' + (currentPage + 1) + ' of ' + users.totalPages}">Page 1</span>
        <a class="btn btn--ghost btn--sm" th:href="@{/admin/users(page=${currentPage + 1}, search=${search})}" th:attr="aria-disabled=${users.last}">
            Next <svg class="i i-sm"><use href="/assets/icons.svg#i-arrow-right"/></svg></a>
    </nav>
</th:block>

<th:block th:fragment="scripts">
    <script src="/js/admin.js"></script>
</th:block>
</body>
</html>
