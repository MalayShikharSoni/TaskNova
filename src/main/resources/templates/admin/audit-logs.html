<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(title='Audit log', content=~{::content}, scripts=~{})}">
<body>
<th:block th:fragment="content" th:with="ap=${actor != '' ? actor : null}">

    <header class="page-head">
        <div>
            <p class="kicker"><span>Admin</span><span class="dot"></span>
                <span th:text="${logs.totalElements + (logs.totalElements == 1 ? ' entry' : ' entries')}">42 entries</span></p>
            <h1>The <em>audit log</em></h1>
            <p class="lede">An append-only record of who did what, and when. Newest at the top.</p>
        </div>
    </header>

    <form class="toolbar" action="/admin/audit-logs" method="get" role="search">
        <div class="search">
            <svg class="i"><use href="/assets/icons.svg#i-search"/></svg>
            <input class="input" type="search" name="actor" id="searchInput" th:value="${actor}" placeholder="Filter by who did it (email or part of it)…" aria-label="Filter by actor"/>
        </div>
        <button class="btn btn--ink" type="submit">Filter</button>
        <a th:if="${actor != ''}" class="btn btn--quiet btn--sm" href="/admin/audit-logs">Clear</a>
    </form>

    <section class="card" th:if="${logs.hasContent()}">
        <ul class="timeline" style="padding:1rem 0">
            <th:block th:each="log : ${logs.content}"><li th:replace="~{fragments/ui :: auditItem(${log})}"></li></th:block>
        </ul>
    </section>

    <section class="card" th:unless="${logs.hasContent()}">
        <div class="empty">
            <svg th:replace="~{fragments/ui :: artCup}"></svg>
            <h3>Nothing recorded</h3>
            <p th:text="${actor != '' ? 'No entries for “' + actor + '”.' : 'Activity will appear here as people use TaskNova.'}">Nothing yet.</p>
        </div>
    </section>

    <nav class="pager" th:if="${logs.totalPages > 1}" aria-label="Pagination">
        <a class="btn btn--ghost btn--sm" th:href="@{/admin/audit-logs(page=${currentPage - 1}, actor=${ap})}" th:attr="aria-disabled=${logs.first}">
            <svg class="i i-sm"><use href="/assets/icons.svg#i-arrow-left"/></svg> Newer</a>
        <span class="mono" th:text="${'Page ' + (currentPage + 1) + ' of ' + logs.totalPages}">Page 1</span>
        <a class="btn btn--ghost btn--sm" th:href="@{/admin/audit-logs(page=${currentPage + 1}, actor=${ap})}" th:attr="aria-disabled=${logs.last}">
            Older <svg class="i i-sm"><use href="/assets/icons.svg#i-arrow-right"/></svg></a>
    </nav>
</th:block>
</body>
</html>
