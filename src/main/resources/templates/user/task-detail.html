<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(title=${task.title}, content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">

    <a href="/tasks" class="back-link" data-back>
        <svg class="i i-sm"><use href="/assets/icons.svg#i-arrow-left"/></svg> Back to tasks
    </a>

    <div class="detail" id="taskDetail"
         th:attr="data-task-id=${task.id},data-can-delete=${canDelete},data-is-admin=${isAdmin}">

        <!-- The document -->
        <form class="card doc" id="taskForm" novalidate>
            <p class="kicker">
                <span th:text="${'Task No. ' + task.id}">Task No. 1</span>
                <span class="dot"></span>
                <span th:text="${'Opened ' + #temporals.format(task.createdAt, 'd MMM yyyy')}" th:if="${task.createdAt != null}">Opened 3 Nov</span>
                <span class="pill pill--overdue" th:if="${task.overdue}">Overdue</span>
            </p>

            <textarea class="doc-title" id="fTitle" name="title" rows="1" maxlength="200" required
                      th:text="${task.title}" aria-label="Task title">Title</textarea>
            <span class="error-text" data-error-for="title"></span>

            <div class="doc-section">
                <span class="label" style="margin-bottom:.45rem">Status</span>
                <div class="segmented" role="group" aria-label="Status" id="statusControl">
                    <button type="button" data-status="TODO" th:attr="aria-pressed=${task.status.name() == 'TODO'}">
                        <span class="swatch" style="background:var(--amber)"></span> To do
                    </button>
                    <button type="button" data-status="IN_PROGRESS" th:attr="aria-pressed=${task.status.name() == 'IN_PROGRESS'}">
                        <span class="swatch" style="background:var(--teal)"></span> In progress
                    </button>
                    <button type="button" data-status="DONE" th:attr="aria-pressed=${task.status.name() == 'DONE'}">
                        <span class="swatch" style="background:var(--green)"></span> Done
                    </button>
                </div>
            </div>

            <div class="doc-section" th:classappend="${isAdmin} ? 'grid-3' : 'grid-2'">
                <div class="field">
                    <label class="label" for="fDue">Due date</label>
                    <input class="input" type="date" id="fDue" name="dueDate" th:value="${task.dueDate}"/>
                </div>
                <div class="field">
                    <label class="label" for="fPriority">Priority</label>
                    <select class="input" id="fPriority" name="priority">
                        <option th:each="p : ${priorities}" th:value="${p}" th:selected="${task.priority == p}"
                                th:text="${#strings.capitalize(#strings.toLowerCase(p.name()))}">Medium</option>
                    </select>
                </div>
                <div class="field" th:if="${isAdmin}">
                    <label class="label" for="fAssignee">Assigned to</label>
                    <select class="input" id="fAssignee" name="assigneeId">
                        <option value="">Nobody</option>
                        <option th:each="u : ${assignableUsers}" th:value="${u.id}"
                                th:selected="${task.assigneeId != null and task.assigneeId == u.id}"
                                th:text="${u.username}">user</option>
                    </select>
                </div>
            </div>

            <div class="doc-section" th:if="${!allTags.isEmpty()}">
                <span class="label" style="margin-bottom:.5rem">Tags</span>
                <div class="tag-picker" data-tag-picker>
                    <button type="button" class="tag-toggle"
                            th:each="tg : ${allTags}"
                            th:attr="data-tag=${tg.name},aria-pressed=${task.tags.contains(tg.name)}"
                            th:style="'--tag:' + ${tg.color}" th:text="${tg.name}">tag</button>
                </div>
            </div>

            <div class="doc-section">
                <label class="label" for="fDesc" style="margin-bottom:.4rem">Notes</label>
                <textarea class="doc-body" id="fDesc" name="description" maxlength="5000"
                          placeholder="Write it down while it's fresh…" th:text="${task.description}"></textarea>
            </div>

            <div class="save-bar">
                <span class="save-state" id="saveState">All changes saved</span>
                <div class="page-actions">
                    <span class="kbd" title="Keyboard shortcut">Ctrl S</span>
                    <button class="btn btn--primary" type="submit" id="saveBtn">
                        <span class="spinner"></span><span class="btn-label">Save changes</span>
                    </button>
                </div>
            </div>
        </form>

        <!-- Spec sheet -->
        <aside class="stack">
            <section class="card spec">
                <p class="kicker" style="margin-bottom:1rem">Spec sheet</p>
                <dl>
                    <dt>Status</dt>
                    <dd><span th:replace="~{fragments/ui :: status(${task})}" id="statusPill"></span></dd>
                    <dt>Priority</dt>
                    <dd><span th:replace="~{fragments/ui :: prio(${task.priority})}"></span></dd>
                    <dt>Owner</dt>
                    <dd>
                        <span class="avatar avatar--sm" th:attr="data-hue=${task.ownerId % 6}"
                              th:text="${#strings.toUpperCase(#strings.substring(task.ownerUsername, 0, 1))}">D</span>
                        <span th:text="${task.ownerUsername}">demo_user</span>
                    </dd>
                    <dt>Assignee</dt>
                    <dd>
                        <th:block th:if="${task.assigneeUsername != null}">
                            <span class="avatar avatar--sm" th:attr="data-hue=${task.assigneeId % 6}"
                                  th:text="${#strings.toUpperCase(#strings.substring(task.assigneeUsername, 0, 1))}">A</span>
                            <span th:text="${task.assigneeUsername}">someone</span>
                        </th:block>
                        <span class="muted" th:if="${task.assigneeUsername == null}">Nobody</span>
                    </dd>
                    <dt>Created</dt>
                    <dd class="mono" th:text="${task.createdAt != null ? #temporals.format(task.createdAt, 'd MMM yyyy, HH:mm') : '—'}">—</dd>
                    <dt>Updated</dt>
                    <dd class="mono" id="updatedAt" th:text="${task.updatedAt != null ? #temporals.format(task.updatedAt, 'd MMM yyyy, HH:mm') : '—'}">—</dd>
                </dl>
            </section>

            <section class="card card--flat danger-zone" th:if="${canDelete}">
                <h3>Delete this task</h3>
                <p>It disappears for everyone, including the assignee. The audit log keeps a note.</p>
                <button class="btn btn--danger btn--sm" type="button" id="deleteTaskBtn">
                    <svg class="i i-sm"><use href="/assets/icons.svg#i-trash"/></svg> Delete task
                </button>
            </section>
        </aside>
    </div>
</th:block>

<th:block th:fragment="scripts">
    <script src="/js/tasks.js"></script>
</th:block>
</body>
</html>
