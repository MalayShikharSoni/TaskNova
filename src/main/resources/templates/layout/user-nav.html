<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- ═══════════════════════════════════════════════
     USER NAVIGATION SIDEBAR FRAGMENT
     Usage: th:replace="~{layout/user-nav :: userNav}"
     ═══════════════════════════════════════════════ -->
<nav th:fragment="userNav" class="nav-content">

    <!-- Brand -->
    <div class="sidebar-brand">
        <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M9 11l3 3L22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
        </div>
        <span class="brand-name">TaskNova</span>
    </div>

    <!-- Nav links -->
    <ul class="nav-links">
        <li>
            <a th:href="@{/dashboard}"
               th:classappend="${currentUri == '/dashboard'} ? 'active' : ''">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                </svg>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a th:href="@{/tasks}"
               th:classappend="${currentUri != null && currentUri.startsWith('/tasks')} ? 'active' : ''">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                <span>My Tasks</span>
            </a>
        </li>
    </ul>

    <!-- Sidebar footer -->
    <div class="sidebar-footer">
        <p class="sidebar-footer-text">TaskNova v1.0</p>
    </div>

</nav>
</body>
</html>
