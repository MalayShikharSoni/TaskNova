<!DOCTYPE html>
<!--/*
  App shell layout. Pages use it like:
    <html th:replace="~{layout/base :: layout(title='Dashboard', content=~{::content}, scripts=~{::scripts})}">
  and define th:fragment="content" (and optionally th:fragment="scripts").
*/-->
<html lang="en" th:fragment="layout(title, content, scripts)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>

<div class="shell">
    <aside class="sidebar" id="sidebar" th:replace="~{layout/sidebar :: sidebar}"></aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
        <!-- Mobile top bar -->
        <header class="topbar">
            <button class="btn btn--quiet btn--icon" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar">
                <svg class="i"><use href="/assets/icons.svg#i-menu"/></svg>
            </button>
            <a href="/" class="brand" style="padding:0">
                <span class="brand-mark"><svg class="i"><use href="/assets/icons.svg#i-nova"/></svg></span>
                <span class="brand-name">Task<em>Nova</em></span>
            </a>
            <button class="btn btn--quiet btn--icon" type="button" data-theme-toggle aria-label="Toggle dark mode">
                <svg class="i theme-icon-dark"><use href="/assets/icons.svg#i-moon"/></svg>
                <svg class="i theme-icon-light"><use href="/assets/icons.svg#i-sun"/></svg>
            </button>
        </header>

        <main class="page" id="main">
            <th:block th:replace="${content}"/>
        </main>

        <footer class="page-foot">
            <span>TaskNova · printed in cobalt &amp; pink</span>
            <span><span class="kbd">Ctrl K</span> jump &nbsp;·&nbsp; <span class="kbd">N</span> new task &nbsp;·&nbsp; <span class="kbd">/</span> search &nbsp;·&nbsp; <a href="/swagger-ui.html" target="_blank" rel="noopener">API docs ↗</a></span>
        </footer>
    </div>
</div>

<!-- Shared confirm dialog (used by Confirm.ask in main.js) -->
<dialog class="modal modal--sm" id="confirmDialog" aria-labelledby="confirmTitle">
    <form method="dialog">
        <div class="modal-head">
            <h2 id="confirmTitle">Are you sure?</h2>
        </div>
        <div class="modal-body"><p id="confirmMessage"></p></div>
        <div class="modal-foot">
            <button class="btn btn--ghost" value="cancel" type="submit">Cancel</button>
            <button class="btn btn--danger" value="confirm" type="submit" id="confirmOk">Confirm</button>
        </div>
    </form>
</dialog>

<!-- Command palette (Ctrl/Cmd + K) -->
<dialog class="modal cmdk" id="cmdk" aria-label="Search or jump to">
    <div class="cmdk-search">
        <svg class="i"><use href="/assets/icons.svg#i-search"/></svg>
        <input type="text" id="cmdkInput" placeholder="Search tasks or jump to a page…" autocomplete="off"
               role="combobox" aria-expanded="true" aria-controls="cmdkList" aria-autocomplete="list"/>
        <span class="kbd">Esc</span>
    </div>
    <ul class="cmdk-list" id="cmdkList" role="listbox"></ul>
    <div class="cmdk-foot"><span>↑ ↓ to move</span><span>↵ to open</span></div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/js/main.js"></script>
<th:block th:replace="${scripts}"/>
</body>
</html>
