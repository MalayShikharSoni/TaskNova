<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create an account')}"></head>
<body>
<div class="auth">
    <section th:replace="~{fragments/poster :: poster(~{::.poster-head}, 'Free to use. Bring your half-remembered to-dos and give them a proper home.')}">
        <h1 class="poster-head">Start a <em>fresh page.</em></h1>
    </section>

    <main class="auth-form-side">
        <button class="btn btn--quiet btn--icon auth-theme" type="button" data-theme-toggle aria-label="Toggle dark mode">
            <svg class="i theme-icon-dark"><use href="/assets/icons.svg#i-moon"/></svg>
            <svg class="i theme-icon-light"><use href="/assets/icons.svg#i-sun"/></svg>
        </button>

        <div class="auth-card reveal-up">
            <p class="kicker">New account</p>
            <h1>Join <em>TaskNova</em></h1>
            <p class="lede">Takes about thirty seconds.</p>

            <div class="alert alert--error" id="registerError" role="alert" hidden>
                <svg class="i"><use href="/assets/icons.svg#i-alert"/></svg>
                <span data-message>Something went wrong.</span>
            </div>

            <form id="registerForm" novalidate>
                <div class="field">
                    <label class="label" for="username">Username</label>
                    <input class="input" id="username" name="username" autocomplete="username" placeholder="e.g. ada_l"
                           minlength="3" maxlength="50" pattern="^[a-zA-Z0-9_]+$" required autofocus/>
                    <span class="help">Letters, numbers and underscores. You can sign in with this too.</span>
                    <span class="error-text" data-error-for="username"></span>
                </div>
                <div class="field">
                    <label class="label" for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required/>
                    <span class="error-text" data-error-for="email"></span>
                </div>
                <div class="field">
                    <label class="label" for="password">Password</label>
                    <div class="input-wrap">
                        <input class="input" type="password" id="password" name="password" autocomplete="new-password"
                               placeholder="8+ characters" minlength="8" required/>
                        <button class="reveal" type="button" data-reveal="password" aria-label="Show password">
                            <svg class="i i-sm"><use href="/assets/icons.svg#i-eye"/></svg>
                        </button>
                    </div>
                    <div class="strength" data-strength-for="password" data-score="0"><i></i><i></i><i></i><i></i></div>
                    <span class="help">Mix upper- and lower-case letters with at least one digit.</span>
                    <span class="error-text" data-error-for="password"></span>
                </div>
                <div class="field">
                    <label class="label" for="confirmPassword">Repeat password</label>
                    <input class="input" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required/>
                    <span class="error-text" data-error-for="confirmPassword"></span>
                </div>
                <button class="btn btn--primary btn--full" type="submit" style="height:46px;margin-top:.4rem">
                    <span class="spinner"></span><span class="btn-label">Create account</span>
                    <svg class="i"><use href="/assets/icons.svg#i-arrow-right"/></svg>
                </button>
            </form>

            <p class="auth-switch">Already have one? <a href="/auth/login">Sign in</a></p>
        </div>
    </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
