# ============================================================
#  TaskNova — Production Profile (Render.com)
# ============================================================

# Activated with SPRING_PROFILES_ACTIVE=prod (render.yaml does this).
# Environment variables (SPRING_DATASOURCE_URL etc.) still override anything here.

# ===== H2 file database (point H2_DB_PATH at a mounted disk for persistence) =====
spring.datasource.url=jdbc:h2:file:${H2_DB_PATH:./data/tasknova};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# ===== Disable H2 Console in production =====
spring.h2.console.enabled=false

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== Thymeleaf cache enabled in prod =====
spring.thymeleaf.cache=true

# ===== JWT (override via Render env var JWT_SECRET) =====
# No fallback on purpose: production must provide its own secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Server =====
server.port=${PORT:8080}

# ===== Actuator (restrict in prod) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===== Logging =====
logging.level.com.tasknova=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
