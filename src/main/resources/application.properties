# ============================================================
#  TaskNova — Application Properties (Development / Default)
# ============================================================

spring.application.name=TaskNova
server.port=${PORT:8080}

# ===== H2 Persistent File Database =====
spring.datasource.url=jdbc:h2:file:./data/tasknova;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== H2 Console (dev only — disable in prod) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# JWT configuration
app.jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7e7d0d9b2a69ec87f8db41e39c747d8a1234567890abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.secret=${app.jwt.secret}
jwt.expiration-ms=${app.jwt.expiration-ms}

# ===== Reverse proxy (Render, Docker ingress) =====
# Trust X-Forwarded-* so request.isSecure() is true behind TLS and the auth cookie gets "Secure".
server.forward-headers-strategy=framework

# ===== Seed data =====
# Override on any non-demo deployment: ADMIN_PASSWORD / DEMO_PASSWORD env vars.
app.seed.admin-password=${ADMIN_PASSWORD:Admin@1234}
app.seed.demo-password=${DEMO_PASSWORD:Demo@1234}
# Show the demo-credentials card on the login page (admin row only appears while the default password is in use)
app.seed.show-demo-hint=${SHOW_DEMO_HINT:true}

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true

info.app.name=TaskNova
info.app.version=1.1.0
info.app.description=Task Management System

# ===== Logging =====
logging.level.com.tasknova=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# ===== Async (used by AuditService @Async) =====
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
