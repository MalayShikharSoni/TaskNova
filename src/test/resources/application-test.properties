# ============================================================
#  TaskNova — Test Profile Configuration
# ============================================================

spring.application.name=TaskNova-Test
server.port=-1

# In-memory H2 for tests
spring.datasource.url=jdbc:h2:mem:tasknovatest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7e7d0d9b2a69ec87f8db41e39c747d8a1234567890abcdef
app.jwt.expiration-ms=3600000
jwt.secret=${app.jwt.secret}
jwt.expiration-ms=${app.jwt.expiration-ms}

# Actuator
management.endpoints.web.exposure.include=health
